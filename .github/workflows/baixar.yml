name: baixar

# Fase separada da mineracao de proposito: baixar nao tem limite de ritmo (medido:
# 11 MB em 1 segundo, sem pausa, sem corte), entao ela nao precisa do paralelismo
# por endereco que a leitura exige. Um trabalho so da conta.

on:
  workflow_dispatch:
    inputs:
      formatos:
        description: "reels, post, carrossel, separados por virgula"
        default: "reels"
      corte:
        description: "quantas vezes a mediana do proprio formato"
        default: "1.5"
      quantos:
        # O PEDIDO INTEIRO VIAJA NESTE CAMPO, e o nome ficou do tempo em que ele so'
        # carregava um numero. Entre a tela e aqui ha' uma ponte que copia campo a
        # campo, e so' o que esta' na lista dela atravessa: medido em 18/08/2026, com
        # uma sonda que imprimiu o pedido deste lado, oito nomes diferentes para "de
        # quais perfis" chegaram todos vazios, e so' este chegou inteiro. A ponte nao
        # pode ser mexida da bancada, entao o canal e' este. Quem separa os dois
        # sentidos e' a funcao `pedido` do baixar.py.
        description: "de quais perfis (nomes separados por virgula) ou um teto de arquivos"
        default: "150"

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # O QUE CHEGOU NO PEDIDO, escrito antes de qualquer trabalho.
      # A tela nao fala com o GitHub: ela fala com a ponte, e a ponte copia campo a
      # campo. Campo que ela nao conhece some no caminho sem avisar ninguem, e ja'
      # houve um campo na tela que nunca chegou aqui por causa disso. Este passo existe
      # para essa perda aparecer no registro em vez de virar misterio.
      #
      # E E' TAMBEM A SONDA: pedindo `quantos` = sonda, este passo e' o unico que roda.
      # Serve para descobrir o que a ponte deixa passar sem gastar um lote inteiro, e
      # foi assim que se descobriu que so' `quantos` atravessa.
      - name: O que chegou no pedido
        env:
          QUANTOS: ${{ inputs.quantos }}
          FORMATOS: ${{ inputs.formatos }}
          CORTE: ${{ inputs.corte }}
        run: |
          echo "quantos  = [$QUANTOS]"
          echo "formatos = [$FORMATOS]"
          echo "corte    = [$CORTE]"

      - name: Conferir os programas
        if: inputs.quantos != 'sonda'
        run: python conferir.py

      - name: Aplicar a regua escolhida na tela
        if: inputs.quantos != 'sonda'
        # SEM ARGUMENTOS, de proposito. Passar formato e corte por aqui refazia a
        # selecao com uma regua diferente da que foi escolhida ao iniciar: o lote saia
        # com outro criterio e ninguem via onde tinha mudado. A regua mora no acervo,
        # gravada pela tela, e e' de la' que este passo le'.
        run: python selecionar.py

      - name: Renovar os links vencidos
        if: inputs.quantos != 'sonda'
        # o link do arquivo dura poucas horas. Se a mineracao foi ontem, ele venceu,
        # e o unico jeito de ter link novo e' reler o perfil.
        run: |
          python - <<'PY'
          import json, pathlib, time
          p = pathlib.Path("dados/selecao.json")
          sel = json.loads(p.read_text(encoding="utf-8"))
          agora = int(time.time())
          antigos = [i for i in sel.get("itens", []) if i.get("arquivo")]
          print(f"{len(antigos)} itens com link. Se o lote falhar em massa, o link venceu:")
          print("nesse caso rode a esteira de novo antes de baixar.")
          PY

      - name: Baixar
        if: inputs.quantos != 'sonda'
        run: python baixar.py "${{ inputs.quantos }}"

      # A CONTA DO QUE FALTA E' REFEITA DEPOIS DE BAIXAR, e nao so' antes.
      # O passo la' de cima roda com a lista de baixados do lote ANTERIOR: sem este
      # aqui, o perfil de onde acabou de sair um lote continuava na fileira da tela com
      # o mesmo numero, e o Gabriel so' veria a mudanca na proxima rodada da esteira.
      - name: Refazer a conta do que falta
        if: always() && inputs.quantos != 'sonda'
        run: python selecionar.py

      - name: Entregar o lote
        if: inputs.quantos != 'sonda'
        uses: actions/upload-artifact@v4
        with:
          name: lote-${{ github.run_number }}
          path: brutos/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Anotar o lote na tela
        if: always() && inputs.quantos != 'sonda'
        run: |
          python - <<'PY'
          import json, pathlib, time
          reg = pathlib.Path("brutos/_lote.json")
          est = json.loads(pathlib.Path("dados/estado.json").read_text(encoding="utf-8"))
          # o criterio do lote e' o que esta' gravado na regua, e nao um texto montado
          # com os argumentos: os dois divergiam, e quem lia a tela via o errado.
          sel = json.loads(pathlib.Path("dados/selecao.json").read_text(encoding="utf-8"))
          c = sel.get("criterio") or {}
          fmt = ", ".join(c.get("formatos") or []) or "todos os formatos"
          if c.get("por_formato"):
              cortes = c.get("cortes") or {}
              # so' repete o nome do formato quando ha' mais de um: com um so',
              # "reels acima de reels 1.5x" era o nome dito duas vezes
              pedidos = [f for f in (c.get("formatos") or []) if f in cortes]
              quanto = (f"{cortes[pedidos[0]]}x" if len(pedidos) == 1
                        else ", ".join(f"{f} {cortes[f]}x" for f in pedidos))
          else:
              quanto = f"{c.get('corte')}x"
          criterio = f"{fmt} acima de {quanto}"
          # DE QUEM VEIO O LOTE, quando ele foi pedido por perfil. Sem isto, dois lotes
          # de perfis diferentes ficavam com a mesma linha na tela.
          pedido = """${{ inputs.quantos }}""".strip()
          if pedido and not pedido.isdigit():
              quem = [c.strip().lstrip("@") for c in pedido.split(",") if c.strip()]
              criterio += " · de @" + ", @".join(quem)
          itens = json.loads(reg.read_text(encoding="utf-8")).get("itens", []) if reg.exists() else []
          lotes = est.get("lotes", [])
          lotes.insert(0, {
              "numero": ${{ github.run_number }},
              "arquivos": len(itens),
              "mb": round(sum(i.get("bytes", 0) for i in itens) / 1048576),
              "criterio": criterio,
              "quando": int(time.time()),
              "execucao": "${{ github.run_id }}",
          })
          est["lotes"] = lotes[:12]
          est["hoje"] = len(itens)
          pathlib.Path("dados/estado.json").write_text(
              json.dumps(est, ensure_ascii=False, indent=1), encoding="utf-8")
          PY
          git config user.name "esteira"
          git config user.email "esteira@users.noreply.github.com"
          git add dados/ && git diff --staged --quiet || git commit -m "lote ${{ github.run_number }}"
          git pull --rebase --autostash origin main || true
          git push || true
