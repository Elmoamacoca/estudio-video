name: baixar

# Fase separada da mineracao de proposito: baixar nao tem limite de ritmo (medido:
# 11 MB em 1 segundo, sem pausa, sem corte), entao ela nao precisa do paralelismo
# por endereco que a leitura exige. Um trabalho so da conta.
#
# A ORDEM E' BAIXAR, TRATAR, ENTREGAR. O que sai daqui ja' saiu limpo: o material cru
# fica na maquina e morre com ela. Antes o tratamento era uma aba separada, para ser
# feito depois, e isso deixava passar a chance de o arquivo ser publicado sem tratamento.

on:
  workflow_dispatch:
    inputs:
      formatos:
        description: "reels, post, carrossel, separados por virgula"
        default: "reels"
      corte:
        description: "quantas vezes a mediana do proprio formato"
        default: "1.5"
      quantos:
        # O PEDIDO INTEIRO VIAJA NESTE CAMPO, e o nome ficou do tempo em que ele so'
        # carregava um numero. Entre a tela e aqui ha' uma ponte que copia campo a
        # campo, e so' o que esta' na lista dela atravessa: medido em 18/08/2026, com
        # uma sonda que imprimiu o pedido deste lado, oito nomes diferentes para "de
        # quais perfis" chegaram todos vazios, e so' este chegou inteiro. A ponte nao
        # pode ser mexida da bancada, entao o canal e' este. Quem separa os sentidos e'
        # a funcao `pedido` do baixar.py, e o prefixo `etiquetar:` desvia para a marcacao.
        description: "de quais perfis (nomes separados por virgula), um teto de arquivos, ou etiquetar:conta|mercado|a;b"
        default: "150"

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PEDIDO: ${{ inputs.quantos }}
      LOTE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      # O QUE CHEGOU NO PEDIDO, escrito antes de qualquer trabalho.
      # A tela nao fala com o GitHub: ela fala com a ponte, e a ponte copia campo a
      # campo. Campo que ela nao conhece some no caminho sem avisar ninguem, e ja'
      # houve um campo na tela que nunca chegou aqui por causa disso.
      #
      # E E' TAMBEM A SONDA: pedindo `quantos` = sonda, este passo e' o unico que roda.
      - name: O que chegou no pedido
        run: |
          echo "quantos  = [$PEDIDO]"
          echo "formatos = [${{ inputs.formatos }}]"
          echo "corte    = [${{ inputs.corte }}]"
          ffmpeg -version | head -1 || echo "SEM FFMPEG"

      # ETIQUETAR NAO E' BAIXAR, e mesmo assim entra por aqui: o caminho da tela ate' a
      # esteira e' um so'. O comeco do texto do pedido diz qual dos dois e'.
      - name: Marcar o perfil
        if: startsWith(inputs.quantos, 'etiquetar:')
        run: |
          python etiquetar.py "$PEDIDO"
          python selecionar.py

      - name: Conferir os programas
        if: inputs.quantos != 'sonda' && !startsWith(inputs.quantos, 'etiquetar:')
        run: python conferir.py

      - name: Abrir o registro do lote
        if: inputs.quantos != 'sonda' && !startsWith(inputs.quantos, 'etiquetar:')
        run: python registro.py abrir "$LOTE" "${{ github.run_id }}" "$PEDIDO"

      - name: Aplicar a regua escolhida na tela
        if: inputs.quantos != 'sonda' && !startsWith(inputs.quantos, 'etiquetar:')
        # SEM ARGUMENTOS, de proposito. Passar formato e corte por aqui refazia a
        # selecao com uma regua diferente da que foi escolhida ao iniciar: o lote saia
        # com outro criterio e ninguem via onde tinha mudado. A regua mora no acervo,
        # gravada pela tela, e e' de la' que este passo le'.
        run: |
          python selecionar.py
          python registro.py separar "$LOTE"

      - name: Baixar o material cru
        if: inputs.quantos != 'sonda' && !startsWith(inputs.quantos, 'etiquetar:')
        run: |
          python baixar.py "$PEDIDO"
          python registro.py baixado "$LOTE"

      # A LIMPEZA E' PASSO OBRIGATORIO, E NAO ETAPA SEGUINTE.
      # Validado em 18/08/2026 nos oito reels do lote 2: o comando conhecido nao limpa,
      # assina, e sao tres camadas diferentes. O que reprova aqui e' apagado e nao entra
      # no lote; o laudo de cada arquivo fica gravado e aparece no registro da tela.
      - name: Tratar
        if: inputs.quantos != 'sonda' && !startsWith(inputs.quantos, 'etiquetar:')
        run: |
          python limpar.py brutos tratados
          python registro.py limpo "$LOTE"

      - name: Entregar o lote tratado
        id: entrega
        if: inputs.quantos != 'sonda' && !startsWith(inputs.quantos, 'etiquetar:')
        uses: actions/upload-artifact@v4
        with:
          name: lote-${{ github.run_number }}
          path: tratados/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Fechar o registro do lote
        if: always() && inputs.quantos != 'sonda' && !startsWith(inputs.quantos, 'etiquetar:')
        run: |
          python registro.py fechar "$LOTE" \
            "${{ steps.entrega.outcome == 'success' && 'sim' || 'nao' }}"

      # A GRAVACAO FINAL E' REDE DE SEGURANCA. O `registro.py` ja' empurra a cada fase;
      # este passo pega o que o caminho de etiquetar escreveu e qualquer sobra.
      - name: Gravar no acervo
        if: always() && inputs.quantos != 'sonda'
        run: |
          git config user.name "esteira"
          git config user.email "esteira@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || git commit -m "pedido ${{ github.run_number }}"
          git pull --rebase --autostash origin main || true
          git push || true
