name: pagina

# PUBLICA A TELA, no lugar do publicador automatico do GitHub Pages.
#
# POR QUE ISTO EXISTE: em 18/08/2026 o publicador automatico passou a falhar em toda
# publicacao, com o recado generico "Page build failed" e nenhum detalhe. O acervo
# recebia o arquivo novo, o Pages nao publicava, e a borda seguia servindo a versao
# anterior. Da tela, parecia demora de propagacao: o arquivo estava certo no acervo e
# simplesmente nao ia para o ar, e cada conserto parecia nao ter funcionado.
#
# Aqui a publicacao e' um trabalho como qualquer outro: se falhar, aparece no log, com
# a linha do erro. E so' sobem os arquivos da tela, sem o acervo de dados junto.

on:
  push:
    branches: [main]
    paths: ["index.html", ".nojekyll"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.subir.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Separar so' a tela
        run: |
          mkdir -p sitio
          cp index.html sitio/
          touch sitio/.nojekyll
          ls -la sitio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: subir
        uses: actions/deploy-pages@v4
